<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Coach Dashboard</title>
    <style>
        :root { --primary: #2563eb; --success: #059669; --danger: #dc2626; --holiday: #9333ea; --coach: #f59e0b; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; margin: 0; padding-bottom: 50px; }
        .nav { background: #1e293b; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 900px; margin: auto; padding: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .stat-card small { color: #64748b; font-size: 0.75rem; text-transform: uppercase; }
        .stat-card div { font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 15px; margin-bottom: 20px; }
        .btn-save { background: var(--success); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .radio-group label { font-size: 0.7rem; padding: 6px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; display: inline-block; }
        input[type="radio"]:checked + label { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="nav">
    <strong>Coach Preetham Dashboard</strong>
    <button onclick="toggleView()" style="background:none; border: 1px solid white; color: white; padding: 5px; border-radius: 4px;">Switch View</button>
</div>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card" style="border-bottom: 4px solid var(--coach)">
            <small>My Absences</small><div id="coachAbs">0</div>
        </div>
        <div class="stat-card" style="border-bottom: 4px solid var(--primary)">
            <small>Sessions Done</small><div id="totalSess">0</div>
        </div>
        <div class="stat-card" style="border-bottom: 4px solid var(--success)">
            <small>Hours Taught</small><div id="totalHrs">0</div>
        </div>
    </div>

    <div id="attendView" class="card">
        <input type="date" id="logDate" style="margin-bottom:10px; padding:10px;">
        <select id="logDuration" style="margin-bottom:10px; padding:10px;">
            <option value="1">1.0 hr</option>
            <option value="1.5" selected>1.5 hrs</option>
            <option value="2">2.0 hrs</option>
        </select>
        <table width="100%">
            <tbody id="studentRows"></tbody>
        </table>
        <button class="btn-save" style="margin-top:20px;" onclick="saveData()">Save Session</button>
    </div>

    <div id="payView" class="card hidden">
        <h3>Payment Records</h3>
        <div id="payStatusList"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzKoo5AEkfL9eU8yBu-JCnKct7wshGYNHeQnZGUPNTBQGBOQMlFAUwqrtt9maPYLrs0/exec"; // REPLACE THIS
    const students = ["Ananya", "Bhuvika", "Koushik","Loukhya" ,"Maanvi", "Sasha", "Sashu", "Varnika", "Vihana"
]; 

    document.getElementById('logDate').valueAsDate = new Date();
    const tbody = document.getElementById('studentRows');
    students.forEach(s => {
        tbody.innerHTML += `
            <tr>
                <td><strong>${s}</strong></td>
                <td class="radio-group">
                    <input type="radio" name="${s}" id="${s}P" value="P" checked hidden><label for="${s}P">P</label>
                    <input type="radio" name="${s}" id="${s}A" value="A" hidden><label for="${s}A">A</label>
                    <input type="radio" name="${s}" id="${s}H" value="H" hidden><label for="${s}H">Sun</label>
                    <input type="radio" name="${s}" id="${s}C" value="CA" hidden><label for="${s}C">C.Abs</label>
                </td>
            </tr>`;
    });

    async function saveData() {
        const records = students.map(s => ({
            name: s, status: document.querySelector(`input[name="${s}"]:checked`).value
        }));
        await fetch(SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({
                action: "save_attendance",
                date: document.getElementById('logDate').value,
                hours: parseFloat(document.getElementById('logDuration').value),
                records
            })
        });
        alert("Saved!");
        loadDashboard();
    }

    async function loadDashboard() {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        // Indexing based on Dashboard layout
        document.getElementById('coachAbs').innerText = data[1][1]; 
        document.getElementById('totalSess').innerText = data[4][4]; // Example student row
        document.getElementById('totalHrs').innerText = data[4][5];
    }

    function toggleView() {
        document.getElementById('attendView').classList.toggle('hidden');
        document.getElementById('payView').classList.toggle('hidden');
    }

    loadDashboard();
</script>
</body>
</html>
